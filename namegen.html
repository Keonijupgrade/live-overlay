  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"09bd8057-c9bb-4c43-9e2f-9f19cc3c5123\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<script src=\"029b13d3-55e4-4852-9c2f-7f3cbf45221b\"><\u002Fscript>\n<script src=\"44cd8266-c827-4039-85dd-909c4670d5ef\"><\u002Fscript>\n<title>KeoniJ — Local Name Generator Overlay<\u002Ftitle>\n<style>html,body{margin:0!important;padding:0!important;background:transparent!important;overflow:hidden!important;font-family:'Arial Black',Arial,sans-serif!important;color:#fff!important}a{color:#ff3b00}a:hover{color:#ff7a00}\n@keyframes ngBlink{0%,100%{opacity:1}50%{opacity:.15}}\n@keyframes ngSlam{0%{transform:scale(1.6) rotate(-2deg);opacity:0;filter:blur(12px)}55%{transform:scale(.95) rotate(.5deg);opacity:1;filter:blur(0)}100%{transform:scale(1) rotate(0);opacity:1}}\n@keyframes ngRise{0%{transform:translateY(28px);opacity:0}100%{transform:translateY(0);opacity:1}}\n@keyframes ngReel{0%{transform:translateY(-16px);opacity:.15;filter:blur(6px)}50%{opacity:.95;filter:blur(1px)}100%{transform:translateY(16px);opacity:.15;filter:blur(6px)}}\n@keyframes ngSweep{0%{transform:translateX(-40%)}100%{transform:translateX(140%)}}\n@keyframes ngRing{0%{transform:scale(.55);opacity:.9}100%{transform:scale(2.2);opacity:0}}\n@keyframes ngCard{0%{transform:translateY(60px);opacity:0}100%{transform:translateY(0);opacity:1}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"position:relative;width:1080px;height:1920px;overflow:hidden;background:transparent;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 40px;boxSizing:border-box\">\n\n<div style=\"position:relative;width:100%;max-width:1000px;boxSizing:border-box;display:flex;align-items:center;height:64px;background:#ff3b00;z-index:99\">\n<div style=\"background:#0d0d0d;color:#ff3b00;font-size:20px;font-weight:900;letter-spacing:4px;padding:0 22px;height:100%;display:flex;align-items:center;white-space:nowrap\">NAME GENERATOR<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:14px;padding:0 26px;font-size:20px;font-weight:900;letter-spacing:3px;color:#fff;white-space:nowrap\"><span style=\"width:14px;height:14px;border-radius:50%;background:#fff;animation:ngBlink 1.2s ease-in-out infinite\"><\u002Fspan>DROP YOUR NAME IN CHAT<\u002Fdiv>\n<div style=\"margin-left:auto;padding:0 26px;font-family:'Courier New',monospace;font-size:22px;font-weight:700;color:#0d0d0d;letter-spacing:2px;white-space:nowrap\">{{ count }} NAMED<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"position:relative;width:100%;max-width:1000px;boxSizing:border-box;background:rgba(13,13,13,.92);border-left:10px solid #ff3b00;padding:56px 56px 64px;animation:ngCard .5s cubic-bezier(.2,.8,.2,1) both\">\n<sc-if value=\"{{ isIdle }}\" hint-placeholder-val=\"{{ true }}\">\n<div>\n<div style=\"font-size:22px;font-weight:700;color:#ff3b00;letter-spacing:6px;text-transform:uppercase\">Waiting on chat<\u002Fdiv>\n<div style=\"font-size:104px;font-weight:900;line-height:1.02;letter-spacing:-1px;text-transform:uppercase;margin-top:24px;color:#fff\">What's your<br>local name?<\u002Fdiv>\n<div style=\"font-size:26px;font-weight:700;color:#888;letter-spacing:2px;margin-top:28px;line-height:1.4\">Type your first name below and I run it. Real Hawaiian if you got one — pidgin if you don't.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ isSpinning }}\">\n<div style=\"position:relative;overflow:hidden\">\n<div style=\"font-size:22px;font-weight:700;color:#ff3b00;letter-spacing:6px;text-transform:uppercase;animation:ngBlink .7s ease-in-out infinite\">Running it…<\u002Fdiv>\n<div style=\"font-size:112px;font-weight:900;line-height:1.05;text-transform:uppercase;margin-top:24px;color:#fff;animation:ngReel .16s linear infinite;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ reelName }}<\u002Fdiv>\n<div style=\"position:absolute;inset:0;width:38%;background:linear-gradient(90deg,transparent,rgba(255,59,0,.35),transparent);animation:ngSweep .8s linear infinite;pointer-events:none\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ hasResult }}\">\n<div style=\"position:relative\">\n<div style=\"position:absolute;left:40%;top:40%;width:420px;height:420px;margin:-210px 0 0 -210px;border:8px solid #ff3b00;border-radius:50%;animation:ngRing .9s ease-out both;pointer-events:none\"><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:18px;flex-wrap:wrap;flex-direction:row-reverse;justify-content:flex-end\">\n<span style=\"font-size:20px;font-weight:900;letter-spacing:4px;text-transform:uppercase;color:#fff;background:#ff3b00;padding:10px 20px;border-radius:4px;animation:ngRise .4s .15s cubic-bezier(.2,.8,.2,1) both\">{{ resultLabel }}<\u002Fspan>\n<span style=\"font-size:24px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#888\">{{ resultInput }} →<\u002Fspan>\n<\u002Fdiv>\n<div style=\"font-size:120px;font-weight:900;line-height:.98;letter-spacing:-3px;text-transform:uppercase;margin-top:28px;color:#ff3b00;overflowWrap:break-word;animation:ngSlam .55s cubic-bezier(.16,1,.3,1) both\">{{ resultName }}<\u002Fdiv>\n<div style=\"font-size:32px;font-weight:700;line-height:1.35;color:#fff;margin-top:32px;animation:ngRise .5s .35s cubic-bezier(.2,.8,.2,1) both\">{{ resultNote }}<\u002Fdiv>\n<sc-if value=\"{{ hasNick }}\">\n<div style=\"margin-top:44px;padding-top:32px;border-top:2px solid #2a2a2a;animation:ngRise .5s .6s cubic-bezier(.2,.8,.2,1) both\">\n<div style=\"font-size:18px;font-weight:900;letter-spacing:5px;text-transform:uppercase;color:#ff3b00\">Local nickname<\u002Fdiv>\n<div style=\"font-size:72px;font-weight:900;line-height:1;letter-spacing:-1px;text-transform:uppercase;color:#fff;margin-top:14px\">{{ nick }}<\u002Fdiv>\n<div style=\"font-size:26px;font-weight:700;line-height:1.4;color:#aaa;margin-top:16px\">{{ nickNote }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showInput }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;gap:16px;margin-top:48px;flex-wrap:wrap;align-items:center\">\n<input id=\"ng-name\" value=\"{{ input }}\" sc-camel-on-change=\"{{ onInput }}\" sc-camel-on-key-down=\"{{ onKey }}\" placeholder=\"Type a name…\" sc-camel-auto-complete=\"off\" sc-camel-spell-check=\"{{ false }}\" style=\"flex:1;min-width:320px;boxSizing:border-box;font-family:'Arial Black',Arial,sans-serif;font-size:34px;font-weight:900;color:#fff;background:#1a1a1a;border:2px solid #2a2a2a;border-radius:8px;padding:22px 26px\">\n<button type=\"button\" sc-camel-on-click=\"{{ go }}\" style=\"font-family:'Arial Black',Arial,sans-serif;font-size:30px;font-weight:900;letter-spacing:2px;text-transform:uppercase;background:#ff3b00;color:#fff;border:0;border-radius:8px;padding:24px 40px;cursor:pointer\" style-hover=\"background:#ff5522\" style-active=\"background:#d63200\">Run it<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ clear }}\" title=\"Clear the screen (Esc)\" style=\"font-family:'Arial Black',Arial,sans-serif;font-size:22px;font-weight:900;letter-spacing:2px;text-transform:uppercase;background:transparent;color:#777;border:2px solid #2a2a2a;border-radius:8px;padding:22px 30px;cursor:pointer\" style-hover=\"color:#fff;border-color:#444\" style-active=\"color:#ff3b00;border-color:#ff3b00\">Clear<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ resetNight }}\" title=\"Reset tonight's count, ticker and hall of fame\" style=\"font-family:'Arial Black',Arial,sans-serif;font-size:22px;font-weight:900;letter-spacing:2px;text-transform:uppercase;background:transparent;color:#3d3d3d;border:2px solid #1f1f1f;border-radius:8px;padding:22px 26px;cursor:pointer\" style-hover=\"color:#888;border-color:#333\" style-active=\"color:#ff3b00;border-color:#ff3b00\">Reset night<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<div style=\"position:absolute;left:0;right:0;bottom:0;boxSizing:border-box;background:linear-gradient(0deg,rgba(13,13,13,.97) 60%,transparent 100%);padding:40px 40px 36px;display:flex;flex-direction:column;gap:20px\">\n<sc-if value=\"{{ showLeaderboard }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;align-items:center;gap:18px;min-width:0\">\n<span style=\"font-size:18px;font-weight:900;letter-spacing:4px;text-transform:uppercase;color:#ff3b00;white-space:nowrap\">Hall of fame<\u002Fspan>\n<div style=\"display:flex;gap:12px;flex-wrap:nowrap;overflow:hidden;flex:1;min-width:0;padding-right:20px;maskImage:linear-gradient(90deg,#000 86%,transparent);WebkitMaskImage:linear-gradient(90deg,#000 86%,transparent)\">\n<sc-for list=\"{{ leaders }}\" as=\"l\" hint-placeholder-count=\"3\">\n<span style=\"display:inline-flex;align-items:center;gap:12px;background:#1f0a00;border:1px solid #4a1a06;border-radius:6px;padding:12px 18px;white-space:nowrap;animation:ngRise .4s cubic-bezier(.2,.8,.2,1) both\"><span style=\"font-size:18px;font-weight:900;color:#ff3b00\">{{ l.rank }}<\u002Fspan><span style=\"font-size:20px;font-weight:900;text-transform:uppercase;color:#fff\">{{ l.name }}<\u002Fspan><span style=\"font-family:'Courier New',monospace;font-size:17px;color:#888\">×{{ l.hits }}<\u002Fspan><\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"display:flex;align-items:center;gap:18px;border-top:1px solid #1e1e1e;padding-top:20px;min-width:0\">\n<span style=\"font-size:18px;font-weight:900;letter-spacing:4px;text-transform:uppercase;color:#444;white-space:nowrap\">Called tonight<\u002Fspan>\n<div style=\"display:flex;gap:12px;flex-wrap:nowrap;overflow:hidden;flex:1;min-width:0;padding-right:20px;maskImage:linear-gradient(90deg,#000 86%,transparent);WebkitMaskImage:linear-gradient(90deg,#000 86%,transparent)\">\n<sc-for list=\"{{ history }}\" as=\"h\" hint-placeholder-count=\"4\">\n<span style=\"display:inline-flex;align-items:center;gap:10px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:6px;padding:12px 18px;white-space:nowrap;animation:ngRise .4s cubic-bezier(.2,.8,.2,1) both\"><span style=\"font-size:19px;font-weight:900;text-transform:uppercase;color:#fff\">{{ h.name }}<\u002Fspan><span style=\"font-family:'Courier New',monospace;font-size:16px;color:#666\">{{ h.input }}<\u002Fspan><\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<span style=\"display:inline-flex;align-items:center;gap:12px;background:#ff3b00;border-radius:6px;padding:12px 20px;white-space:nowrap\"><span style=\"font-size:16px;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:#fff\">Follow<\u002Fspan><span style=\"font-size:22px;font-weight:900;color:#fff\">{{ handle }}<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:20px;font-size:15px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#333;flex-wrap:wrap\">\n<span style=\"display:inline-flex;align-items:center;gap:14px\"><span style=\"width:10px;height:10px;border-radius:50%;background:{{ connColor }}\"><\u002Fspan>{{ connLabel }}<\u002Fspan>\n<button type=\"button\" sc-camel-on-click=\"{{ toggleComic }}\" title=\"Allow the teasing roots — hamajang, irraz, tantaran\" style=\"font-family:'Arial Black',Arial,sans-serif;font-size:14px;font-weight:900;letter-spacing:3px;text-transform:uppercase;background:transparent;border:0;padding:0;cursor:pointer;color:{{ comicColor }}\">{{ comicLabel }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1920},&quot;handle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;@keonijupgrade&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Overlay&quot;},&quot;showInput&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Overlay&quot;},&quot;showLeaderboard&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Overlay&quot;},&quot;spinMs&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1400,&quot;min&quot;:400,&quot;max&quot;:3000,&quot;step&quot;:100,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Overlay&quot;}}\">\nconst STORE = \"kjl-namegen-v2\";\n\nclass Component extends DCLogic {\n  state = { input: \"\", phase: \"idle\", reelName: \"Kawika\", result: null, history: [], count: 0, votes: {}, given: [], comic: false, gender: \"male\", conn: \"off\" };\n\n  componentDidMount() {\n    try {\n      const saved = JSON.parse(localStorage.getItem(STORE) || \"null\");\n      if (saved) this.setState({\n        history: Array.isArray(saved.history) ? saved.history : [],\n        count: saved.count || 0,\n        votes: saved.votes || {},\n        given: Array.isArray(saved.given) ? saved.given : []\n      });\n    } catch (e) {}\n    this.connect();\n  }\n  componentWillUnmount() {\n    clearInterval(this._spin); clearTimeout(this._stop);\n    if (this._ch) { try { this._ch.unsubscribe(); } catch (e) {} }\n  }\n\n  // Same Supabase project + channel the show overlay already uses; separate event name.\n  connect() {\n    const url = this.props.supabaseUrl ?? \"https://yznpnwkgqqavfnllzmxd.supabase.co\";\n    const key = this.props.supabaseKey ?? \"sb_publishable_cPrO57tuEyTU6pQ6hXGwRg_lhB5XRf-\";\n    if (!window.supabase || !url || !key) return;\n    try {\n      const sb = window.supabase.createClient(url, key);\n      const ch = sb.channel(\"keonij-overlay\");\n      ch.on(\"broadcast\", { event: \"namegen\" }, ({ payload }) => {\n        if (!payload) return;\n        if (payload.type === \"clear\") return this.setState({ phase: \"idle\", result: null });\n        if (payload.type === \"love\") return this.voteUp();\n        if (payload.type === \"comic\") return this.setState({ comic: !!payload.on });\n        if (payload.type === \"gender\") return this.setState({ gender: payload.value });\n        if (payload.gender) return this.setState({ gender: payload.gender }, () => this.run(payload.name));\n        if (payload.type === \"reset\") {\n          try { localStorage.removeItem(STORE); } catch (e) {}\n          return this.setState({ history: [], count: 0, votes: {}, given: [], phase: \"idle\", result: null });\n        }\n        if (payload.name) this.run(payload.name);\n      }).subscribe((status) => {\n        this.setState({ conn: status === \"SUBSCRIBED\" ? \"on\" : (status === \"CHANNEL_ERROR\" || status === \"TIMED_OUT\" ? \"err\" : \"off\") });\n      });\n      this._ch = ch;\n    } catch (e) { this.setState({ conn: \"err\" }); }\n  }\n\n  save(patch) {\n    const s = Object.assign({ history: this.state.history, count: this.state.count, votes: this.state.votes, given: this.state.given }, patch);\n    try { localStorage.setItem(STORE, JSON.stringify(s)); } catch (e) {}\n  }\n\n  run(raw) {\n    const gen = window.NAMEGEN;\n    if (!gen) return;\n    // Pidgin names are sound-matched to the name, so no dedupe needed — but the\n    // teasing roots (hamajang, irraz, tantaran) only come out when comic mode is on.\n    const result = gen.lookup(raw, null, { comic: this.state.comic, gender: this.state.gender });\n    if (!result) return;\n    const pool = gen.reelPool;\n    clearInterval(this._spin); clearTimeout(this._stop);\n    this.setState({ phase: \"spin\" });\n    this._spin = setInterval(() => {\n      this.setState({ reelName: pool[Math.floor(Math.random() * pool.length)] });\n    }, 90);\n    this._stop = setTimeout(() => {\n      clearInterval(this._spin);\n      const history = [result, ...this.state.history].slice(0, 6);\n      const count = this.state.count + 1;\n      const given = result.kind === \"pidgin\" && this.state.given.indexOf(result.name) < 0\n        ? [result.name, ...this.state.given].slice(0, 200)\n        : this.state.given;\n      this.save({ history, count, given });\n      this.setState({ phase: \"result\", result, history, count, given, input: \"\" });\n      const el = document.getElementById(\"ng-name\");\n      if (el) el.focus();\n    }, Math.max(400, Number(this.props.spinMs ?? 1400)));\n  }\n\n  go = () => this.run(this.state.input);\n\n  clear = () => {\n    clearInterval(this._spin); clearTimeout(this._stop);\n    this.setState({ phase: \"idle\", result: null, input: \"\" });\n    const el = document.getElementById(\"ng-name\");\n    if (el) el.focus();\n  };\n\n  resetNight = () => {\n    clearInterval(this._spin); clearTimeout(this._stop);\n    try { localStorage.removeItem(STORE); } catch (e) {}\n    this.setState({ history: [], count: 0, votes: {}, given: [], phase: \"idle\", result: null, input: \"\" });\n  };\n\n  voteUp = () => {\n    const r = this.state.result;\n    if (!r) return;\n    const votes = Object.assign({}, this.state.votes);\n    votes[r.name] = (votes[r.name] || 0) + 1;\n    this.save({ votes });\n    this.setState({ votes });\n  };\n\n  renderVals() {\n    const s = this.state, r = s.result;\n    const leaders = Object.keys(s.votes)\n      .map((name) => ({ name, hits: s.votes[name] }))\n      .sort((a, b) => b.hits - a.hits)\n      .slice(0, 3)\n      .map((l, i) => ({ name: l.name, hits: l.hits, rank: \"#\" + (i + 1) }));\n    return {\n      input: s.input,\n      onInput: (e) => this.setState({ input: e.target.value }),\n      onKey: (e) => {\n        if (e.key === \"Enter\") this.go();\n        if (e.key === \"Escape\") this.clear();\n      },\n      go: this.go,\n      clear: this.clear,\n      resetNight: this.resetNight,\n      comic: s.comic,\n      comicLabel: s.comic ? \"Comic mode on\" : \"Comic mode off\",\n      comicColor: s.comic ? \"#ff3b00\" : \"#3d3d3d\",\n      toggleComic: () => this.setState({ comic: !s.comic }),\n      isIdle: s.phase === \"idle\",\n      isSpinning: s.phase === \"spin\",\n      hasResult: s.phase === \"result\" && !!r,\n      reelName: s.reelName,\n      resultName: r ? r.name : \"\",\n      resultInput: r ? r.input : \"\",\n      resultNote: r ? r.note : \"\",\n      resultLabel: r ? (r.label || (r.kind === \"hawaiian\" ? \"Real Hawaiian name\" : \"Local nickname\")) : \"\",\n      hasNick: !!(r && r.nick),\n      nick: r ? r.nick || \"\" : \"\",\n      nickNote: r ? r.nickNote || \"\" : \"\",\n      history: s.history,\n      count: s.count,\n      leaders,\n      showLeaderboard: (this.props.showLeaderboard ?? true) && leaders.length > 0,\n      showInput: this.props.showInput ?? true,\n      handle: this.props.handle ?? \"@keonijupgrade\",\n      connColor: s.conn === \"on\" ? \"#00cc66\" : (s.conn === \"err\" ? \"#ff3b00\" : \"#333\"),\n      connLabel: s.conn === \"on\" ? \"Phone control connected\" : (s.conn === \"err\" ? \"Control offline — refresh\" : \"Connecting…\")\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
